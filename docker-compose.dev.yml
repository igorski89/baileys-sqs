services:
  # ElasticMQ - SQS-compatible queue server for local development
  elasticmq:
    container_name: baileys-sqs-elasticmq-dev
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"  # SQS API port
      - "9325:9325"  # REST API port
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
      - ./docker-volumes/elasticmq:/data
    command: -Dconfig.file=/opt/elasticmq.conf
    networks:
      - baileys-sqs-network

  # MinIO - S3-compatible object storage for local media uploads
  minio:
    container_name: baileys-sqs-minio-dev
    image: minio/minio:latest
    ports:
      - "9000:9000"  # S3 API port
      - "9001:9001"  # MinIO Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./docker-volumes/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - baileys-sqs-network

  # MinIO bucket creation helper (one-shot init container)
  minio-create-bucket:
    container_name: baileys-sqs-minio-create-bucket-dev
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: >
      /bin/sh -c "
        sleep 5 &&
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb local/baileys-sqs-media --ignore-existing &&
        mc anonymous set download local/baileys-sqs-media
      "
    networks:
      - baileys-sqs-network

  # Baileys SQS Application - Development mode with hot reload
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: baileys-sqs-app-dev:latest
    container_name: baileys-sqs-app-dev
    # ports:
    #   - "3000:3000"  # only needed if PORT is set below
    command: >
      sh -c "npm install &&
             npx tsx watch --clear-screen=false index.ts"
    volumes:
      # Mount source code for hot reloading
      - .:/app
      # Persist node_modules separately to avoid overwriting with empty host directory
      - /app/node_modules
      # Persist WhatsApp auth credentials
      - ./docker-volumes/auth:/app/auth_info_baileys
    environment:
      - NODE_ENV=development
      - AWS_REGION=elasticmq
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_ENDPOINT_URL=http://elasticmq:9324
      - INPUT_QUEUE=http://elasticmq:9324/queue/input-queue
      - OUTPUT_QUEUE=http://elasticmq:9324/queue/output-queue
      - SESSION_DIR=/app/auth_info_baileys
      - LOG_LEVEL=debug
      - WHATSAPP_VERSION=[2, 3000, 1036200034]
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=baileys-sqs-media
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
      # Optional: HTTP input endpoint, additive to the SQS input queue (see README)
      # - PORT=3000
      # - AUTH_TOKEN=change_me_to_a_long_random_value
    depends_on:
      - elasticmq
      - minio
    networks:
      - baileys-sqs-network
    stdin_open: true
    tty: true

  # Output Queue Listener - For development debugging
  listener:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: baileys-sqs-listener-dev:latest
    container_name: baileys-sqs-listener-dev
    command: >
      sh -c "npm install &&
             npx tsx watch --clear-screen=false listener.ts"
    volumes:
      # Mount source code for hot reloading
      - .:/app
      # Persist node_modules separately
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - AWS_REGION=elasticmq
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - OUTPUT_QUEUE=http://elasticmq:9324/queue/output-queue
      - DEBUG=true
    depends_on:
      - elasticmq
    networks:
      - baileys-sqs-network
    stdin_open: true
    tty: true

  # CLI Sender Tool - Interactive WhatsApp message sender
  sender:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: baileys-sqs-sender-dev:latest
    container_name: baileys-sqs-sender-dev
    command: >
      sh -c "npm install &&
             npx tsx sender.ts"
    volumes:
      # Mount source code for hot reloading
      - .:/app
      # Persist node_modules separately
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - AWS_REGION=elasticmq
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_ENDPOINT_URL=http://elasticmq:9324
      - INPUT_QUEUE=http://elasticmq:9324/queue/input-queue
    depends_on:
      - elasticmq
    networks:
      - baileys-sqs-network
    stdin_open: true
    tty: true

networks:
  baileys-sqs-network:
    driver: bridge
